<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Beau temps</title><defs>
<radialGradient id="sun" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#FFE57F"/><stop offset="1" stop-color="#FFA000"/></radialGradient>
<linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC4F5"/><stop offset="1" stop-color="#1E88E5"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EDF3"/></linearGradient>
<linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCA28"/><stop offset="1" stop-color="#FB8C00"/></linearGradient>
<linearGradient id="nu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B0BEC5"/><stop offset="1" stop-color="#78909C"/></linearGradient>
<linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64B5F6"/><stop offset="1" stop-color="#1E88E5"/></linearGradient>
<linearGradient id="ne" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B3E5FC"/><stop offset="1" stop-color="#4FC3F7"/></linearGradient>
<linearGradient id="na" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0E0E0"/><stop offset="1" stop-color="#BDBDBD"/></linearGradient>
</defs><style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
@keyframes shimmer{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-3px)}90%{transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.spin{transform-box:view-box;animation:spin 12s linear infinite}
.spinslow{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.col{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.2s ease-out both,breathe 3s ease-in-out 1.2s infinite}
.shimmer{animation:shimmer 2s ease-in-out infinite}
.bob{animation:bob 2.5s ease-in-out infinite}
.hop{animation:hop 2.4s ease-in-out infinite}
.drift{animation:drift 4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
</style><circle cx="32" cy="32" r="29" fill="url(#bt)"/><circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><g class="spin" style="transform-origin:32px 32px" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"><line x1="45.0" y1="32.0" x2="51.0" y2="32.0"/><line x1="41.2" y1="41.2" x2="45.4" y2="45.4"/><line x1="32.0" y1="45.0" x2="32.0" y2="51.0"/><line x1="22.8" y1="41.2" x2="18.6" y2="45.4"/><line x1="19.0" y1="32.0" x2="13.0" y2="32.0"/><line x1="22.8" y1="22.8" x2="18.6" y2="18.6"/><line x1="32.0" y1="19.0" x2="32.0" y2="13.0"/><line x1="41.2" y1="22.8" x2="45.4" y2="18.6"/></g><circle class="pulse" cx="32" cy="32" r="9.5" fill="#FFFFFF"/></svg>
