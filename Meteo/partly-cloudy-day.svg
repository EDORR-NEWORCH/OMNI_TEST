<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Eclaircies</title><defs>
<radialGradient id="sun" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#FFE57F"/><stop offset="1" stop-color="#FFA000"/></radialGradient>
<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE5EE"/></linearGradient>
<linearGradient id="cloudgrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D4DE"/><stop offset="1" stop-color="#9FB0C0"/></linearGradient>
<linearGradient id="cloudrain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3EAF1"/><stop offset="1" stop-color="#B4C3D1"/></linearGradient>
<linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC4F5"/><stop offset="1" stop-color="#1E88E5"/></linearGradient>
</defs><style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
@keyframes driftb{0%,100%{transform:translateX(0)}50%{transform:translateX(-2px)}}
@keyframes fall{0%{transform:translateY(-5px);opacity:0}25%{opacity:1}100%{transform:translateY(7px);opacity:0}}
@keyframes snow{0%{transform:translateY(-4px) rotate(0);opacity:0}25%{opacity:1}100%{transform:translateY(7px) rotate(90deg);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.rays{transform-box:view-box;animation:spin 12s linear infinite}
.core{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.drift{animation:drift 4s ease-in-out infinite}
.driftb{animation:driftb 5s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.snow{transform-box:fill-box;transform-origin:center;animation:snow 2.6s linear infinite}
.bob{animation:bob 2.5s ease-in-out infinite}
</style><g class="rays" style="transform-origin:24px 22px" stroke="#FFB300" stroke-width="2.6" stroke-linecap="round"><line x1="36.5" y1="22.0" x2="41.5" y2="22.0"/><line x1="32.8" y1="30.8" x2="36.4" y2="34.4"/><line x1="24.0" y1="34.5" x2="24.0" y2="39.5"/><line x1="15.2" y1="30.8" x2="11.6" y2="34.4"/><line x1="11.5" y1="22.0" x2="6.5" y2="22.0"/><line x1="15.2" y1="13.2" x2="11.6" y2="9.6"/><line x1="24.0" y1="9.5" x2="24.0" y2="4.5"/><line x1="32.8" y1="13.2" x2="36.4" y2="9.6"/></g><circle class="core" cx="24" cy="22" r="9" fill="url(#sun)"/><g class="drift"><path d="M20 46H46A9 9 0 0 0 47.5 28.1A13 13 0 0 0 22.6 25.6A10.5 10.5 0 0 0 20 46Z" transform="translate(10 10) scale(0.8)" fill="url(#cloud)" stroke="#A9BAC8" stroke-width="1.5" stroke-linejoin="round"/></g></svg>
